<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Generator · Voice Bot</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e4e0;
    --accent: #c8102e; --accent-soft: #fbe9ec; --ok: #137a3f; --ok-soft: #e5f4ea;
    --warn: #a15c00; --warn-soft: #fdf0dc; --info: #1f4fa3; --info-soft: #e7eefb; --flash: #fff3b0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Devanagari", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header .sub { color: var(--muted); }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--line); color: var(--ink); white-space: nowrap; }
  .badge.live { background: var(--ok-soft); color: var(--ok); }
  .badge.offline { background: var(--warn-soft); color: var(--warn); }
  .badge.strong { background: var(--ok-soft); color: var(--ok); }
  .badge.moderate { background: var(--warn-soft); color: var(--warn); }
  .badge.none { background: var(--line); color: var(--muted); }
  .badge.live-switch { background: var(--accent-soft); color: var(--accent); }
  .badge.history { background: var(--info-soft); color: var(--info); }
  main { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(340px, 1.25fr) minmax(300px, 1fr); gap: 14px; padding: 14px; height: calc(100vh - 53px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  section > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .scroll { overflow-y: auto; padding: 12px 14px; flex: 1; min-height: 0; }
  select, textarea, input[type=text] { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); }
  textarea { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 140px; }
  button { font: inherit; font-weight: 600; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 7px 12px; border-radius: 7px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; }
  .seller-meta { color: var(--muted); font-size: 12.5px; margin: 8px 0 4px; }
  .persona-label { font-size: 15px; font-weight: 700; margin: 12px 0 2px; }
  .field { border-top: 1px solid var(--line); padding: 9px 0; transition: background .6s; }
  .field.flash { background: var(--flash); }
  .field .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .field .v { font-weight: 600; margin-top: 2px; word-break: break-word; }
  .field .why { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .meter { height: 6px; background: var(--line); border-radius: 3px; margin-top: 5px; position: relative; }
  .meter > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 3px; transition: width .5s; }
  details summary { cursor: pointer; color: var(--info); font-size: 12px; margin-top: 4px; }
  pre { white-space: pre-wrap; font-size: 11.5px; background: var(--bg); padding: 8px; border-radius: 6px; }
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 85%; padding: 8px 11px; border-radius: 12px; }
  .bubble.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
  .bubble.seller { align-self: flex-end; background: var(--info-soft); }
  .bubble .meta { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .bubble .sig { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin: 3px 4px 0 0; }
  .controls { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font-weight: 500; font-size: 12px; padding: 4px 9px; border-radius: 99px; }
  #mic { min-width: 120px; }
  #mic.rec { background: var(--accent); color: #fff; border-color: var(--accent); }
  #status { font-size: 12px; color: var(--muted); min-height: 16px; }
  .event { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 9px 11px; margin-bottom: 10px; animation: pop .35s ease; }
  .event .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .event .sigtype { font-weight: 700; color: var(--accent); text-transform: uppercase; font-size: 12px; letter-spacing: .04em; }
  .event .trigger { font-style: italic; margin: 4px 0; }
  .event table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 5px 0; }
  .event td { padding: 2px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  .event td:first-child { color: var(--muted); }
  .event .reason { font-size: 12.5px; }
  .outcome { padding: 10px 12px; border-radius: 8px; font-weight: 700; margin-bottom: 10px; }
  .outcome.ok { background: var(--ok-soft); color: var(--ok); }
  .outcome.no { background: var(--warn-soft); color: var(--warn); }
  .empty { color: var(--muted); font-size: 13px; }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; height: auto; } section { max-height: none; } .scroll { max-height: 70vh; } }
</style>
</head>
<body>
<header>
  <h1>Persona Generator</h1>
  <span class="sub">Voice Bot persona per seller, adapted live</span>
  <span style="flex:1"></span>
  <span id="mode" class="badge">…</span>
</header>
<main>
  <section>
    <h2>Seller → Persona <span id="pver" class="badge"></span></h2>
    <div class="scroll">
      <div class="row">
        <select id="seller"></select>
        <button id="custom-toggle" title="Paste a seller the bot has never seen">Custom</button>
      </div>
      <div id="custom" hidden style="margin-top:8px">
        <textarea id="custom-json" placeholder='{"seller_id":"X1","name":"...","city":"...","state":"...","region":"north","business_type":"trader","age":30,"annual_turnover":"1Cr-5Cr","categories":["..."],"languages_known":["hi","en"],"engagement":{"enquiries_received_30d":5},"past_calls":[]}'></textarea>
      </div>
      <div id="seller-meta" class="seller-meta"></div>
      <div class="row" style="margin-top:8px">
        <button id="gen">Generate persona</button>
        <button id="start" class="primary">Start call</button>
      </div>
      <div id="persona"><p class="empty" style="margin-top:14px">Pick a seller and generate a persona.</p></div>
    </div>
  </section>

  <section>
    <h2>Live call <span id="stage" class="badge"></span></h2>
    <div class="scroll"><div id="chat" class="chat"><p class="empty">Start a call to talk to the bot as the seller.</p></div></div>
    <div class="controls">
      <div class="chips" id="chips"></div>
      <div class="row">
        <button id="mic" disabled>🎙 Hold to talk</button>
        <input id="say" type="text" placeholder="…or type what the seller says" disabled>
        <button id="send" disabled>Send</button>
      </div>
      <div id="status"></div>
    </div>
  </section>

  <section>
    <h2>Switch log <span style="flex:1"></span><button id="export" disabled style="font-size:11px;padding:3px 8px">Export JSON</button></h2>
    <div class="scroll" id="log"><p class="empty">Persona switches appear here as they happen: signal → change → reason.</p></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { sellers: [], session: null, persona: null, mode: "offline", busy: false, audio: null };
const CHIPS = [
  "Haan bolo", "Yaar point pe aao, kitni der se bol rahe ho!", "मतलब? समझा नहीं",
  "Sorry, can you speak in English please", "Abhi busy hoon, customer aaya hai",
  "Accha, isme mera fayda kya hai?", "Main already TradeIndia pe hoon", "Haan theek hai, kal 11 baje chalega",
];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}
function status(msg) { $("status").textContent = msg || ""; }

async function init() {
  const h = await api("/api/health");
  state.mode = h.mode;
  $("mode").textContent = h.mode === "live" ? `LIVE · Sarvam ${h.tts_model}` : "OFFLINE · browser voice (add SARVAM_API_KEY for Sarvam)";
  $("mode").className = "badge " + h.mode;
  state.sellers = await api("/api/sellers");
  $("seller").innerHTML = state.sellers.map((s) => `<option value="${s.seller_id}">${esc(s.name)} · ${esc(s.city)}</option>`).join("");
  $("seller").onchange = showSeller; showSeller();
  $("chips").innerHTML = CHIPS.map((c) => `<button data-t="${esc(c)}" disabled>${esc(c)}</button>`).join("");
  $("chips").querySelectorAll("button").forEach((b) => (b.onclick = () => sellerSays(b.dataset.t)));
}

function currentSellerReq() {
  if (!$("custom").hidden && $("custom-json").value.trim()) {
    try { return { seller: JSON.parse($("custom-json").value) }; } catch (e) { throw new Error("Custom seller JSON is invalid: " + e.message); }
  }
  return { seller_id: $("seller").value };
}
function showSeller() {
  const s = state.sellers.find((x) => x.seller_id === $("seller").value); if (!s) return;
  const calls = s.past_calls?.length ? s.past_calls.map((c) => `${c.duration_s}s, ${c.outcome}`).join("; ") : "no past calls (cold start)";
  $("seller-meta").innerHTML = `${esc(s.company)} · ${esc(s.business_type)} · age ${s.age} · ${esc(s.annual_turnover)}<br>${esc((s.categories || []).join(", "))} · speaks ${esc((s.languages_known || []).join("/"))}<br>Past calls: ${esc(calls)}`;
}
$("custom-toggle").onclick = () => { $("custom").hidden = !$("custom").hidden; };

function confBadge(r) {
  if (!r) return "";
  if (r.source && r.source.startsWith("seller_history")) return `<span class="badge history">seller history</span>`;
  if (r.source === "live_signal") return `<span class="badge live-switch">live switch</span>`;
  if (r.source === "rule") return `<span class="badge none">rule</span>`;
  const c = r.evidence?.confidence; return c ? `<span class="badge ${c}">${c === "none" ? "default kept" : c + " evidence"}</span>` : "";
}
function field(key, label, value, r, extra = "") {
  return `<div class="field" data-k="${key}"><div class="k">${label} ${confBadge(r)}</div><div class="v">${value}</div>${extra}${r ? `<div class="why">${esc(r.why)}</div>` : ""}</div>`;
}
function renderPersona(p, changed = []) {
  state.persona = p; const R = p.rationale || {};
  $("pver").textContent = "v" + p.version;
  const pacePct = Math.round(((p.voice.pace - 0.5) / 1.5) * 100);
  const pb = Object.entries(p.plan.objection_playbook).map(([k, v]) => `<div style="margin:4px 0"><b>${esc(k)}</b>: ${esc(v)}</div>`).join("");
  $("persona").innerHTML = `
    <div class="persona-label">${esc(p.label)}</div>
    ${field("language", "Language", `${esc(p.language.name)} · ${esc(p.language.style)} · address as “${esc(p.language.address_as)}”`, R.language)}
    ${field("voice", "Voice", `${esc(p.voice.speaker)} (${esc(p.voice.gender)}) · pace ${p.voice.pace}x · temp ${p.voice.temperature}`, R.voice, `<div class="meter"><i style="width:${pacePct}%"></i></div>`)}
    ${field("pace", "Pace", esc(p.tone.pace_label), R.pace)}
    ${field("formality", "Formality", esc(p.language.formality), R.formality)}
    ${field("tone", "Delivery", `max ${p.tone.max_sentence_words} words/sentence · energy ${esc(p.tone.energy)} · warmth ${esc(p.tone.warmth)} · strategy <b>${esc(p.tone.strategy)}</b>`)}
    ${field("opening", "Opening", "“" + esc(p.plan.opening) + "”", R.opening)}
    ${field("playbook", "Objection playbook", `<details><summary>${Object.keys(p.plan.objection_playbook).length} answers, ordered for this seller</summary>${pb}</details>`, R.objection_playbook)}
    ${R.cold_start ? field("cold", "Cold start", "yes", R.cold_start) : ""}
    <details style="margin-top:8px"><summary>Raw persona spec (JSON)</summary><pre>${esc(JSON.stringify(p, null, 2))}</pre></details>`;
  const map = { language: "language", voice: "voice", tone: "tone", plan: "opening" };
  changed.forEach((c) => {
    const top = c.field.split(".")[0];
    const k = c.field.startsWith("voice.pace") ? "voice" : map[top] || top;
    const el = document.querySelector(`.field[data-k="${k}"]`);
    if (el) { el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2500); }
  });
}

$("gen").onclick = async () => {
  try { status("Generating persona…"); const r = await api("/api/persona", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(currentSellerReq()) }); renderPersona(r.persona); status(""); }
  catch (e) { status("⚠ " + e.message); }
};

$("start").onclick = async () => {
  stopAudio();
  try {
    status("Dialling…");
    const r = await api("/api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(currentSellerReq()) });
    state.session = r.session_id; renderPersona(r.persona);
    $("chat").innerHTML = ""; $("log").innerHTML = `<p class="empty">No switches yet. Persona v1 is live.</p>`;
    $("stage").textContent = "opening";
    ["mic", "say", "send", "export"].forEach((id) => ($(id).disabled = false));
    $("chips").querySelectorAll("button").forEach((b) => (b.disabled = false));
    addBubble("bot", r.bot.text, `v${r.persona.version} · ${r.bot.voice.speaker} · pace ${r.bot.voice.pace}x`);
    await speak(r.bot); status("Your turn: speak or type as the seller.");
  } catch (e) { status("⚠ " + e.message); }
};

function addBubble(role, text, meta, signals = []) {
  const el = document.createElement("div"); el.className = "bubble " + role;
  const sig = signals.filter((s) => s.confidence >= 0.6).map((s) => `<span class="sig">${esc(s.type)}</span>`).join("");
  el.innerHTML = `${esc(text)}${sig ? `<div>${sig}</div>` : ""}${meta ? `<div class="meta">${esc(meta)}</div>` : ""}`;
  $("chat").appendChild(el); el.scrollIntoView({ behavior: "smooth", block: "end" });
}

function addEvent(e) {
  const empty = $("log").querySelector(".empty"); if (empty) empty.remove();
  const rows = e.changes.map((c) => `<tr><td>${esc(c.field)}</td><td>${esc(c.from)} → <b>${esc(c.to)}</b></td></tr>`).join("");
  const el = document.createElement("div"); el.className = "event";
  el.innerHTML = `<div class="top"><span class="sigtype">${esc(e.signal.replace("_", " "))}</span><span>turn ${e.turn} · ${e.at_s}s · conf ${e.confidence} · v${e.persona_version}</span></div>
    <div class="trigger">“${esc(e.trigger)}”</div><table>${rows}</table><div class="reason">${esc(e.reason)}</div>`;
  $("log").prepend(el);
}

async function sellerSays(text, audioBlob) {
  if (state.busy || !state.session) return;
  state.busy = true; stopAudio(); status("Bot is thinking…");
  const fd = new FormData();
  if (audioBlob) fd.append("audio", audioBlob, "turn.wav"); else fd.append("text", text);
  try {
    const r = await api(`/api/session/${state.session}/turn`, { method: "POST", body: fd });
    addBubble("seller", r.seller_text, "", r.signals);
    r.switches.forEach(addEvent);
    if (r.switches.length) renderPersona(r.persona, r.switches.flatMap((s) => s.changes));
    addBubble("bot", r.bot.text, `v${r.persona.version} · ${r.bot.voice.speaker} · pace ${r.bot.voice.pace}x · ${r.bot.language_code}`);
    $("stage").textContent = r.stage;
    if (r.meeting) { const o = document.createElement("div"); o.className = "outcome ok"; o.textContent = `✅ Meeting fixed: ${r.meeting.slot} (at ${r.meeting.fixed_at_s}s)`; $("log").prepend(o); }
    else if (r.stage === "done") { const o = document.createElement("div"); o.className = "outcome no"; o.textContent = "Call closed politely, no meeting"; $("log").prepend(o); }
    (r.warnings || []).forEach((w) => console.warn(w));
    status(r.stage === "done" ? "Call ended." : "Your turn.");
    await speak(r.bot);
  } catch (e) { status("⚠ " + e.message); }
  finally { state.busy = false; }
}
$("send").onclick = () => { const t = $("say").value.trim(); if (t) { $("say").value = ""; sellerSays(t); } };
$("say").onkeydown = (e) => { if (e.key === "Enter") $("send").onclick(); };

// ---- speaking -------------------------------------------------------------
function stopAudio() { if (state.audio) { state.audio.pause(); state.audio = null; } window.speechSynthesis?.cancel(); }
function speak(bot) {
  return new Promise((resolve) => {
    if (bot.audio_b64) {
      const a = new Audio("data:audio/wav;base64," + bot.audio_b64); state.audio = a;
      a.onended = resolve; a.onerror = resolve; a.play().catch(resolve); return;
    }
    if (!window.speechSynthesis) return resolve();
    const u = new SpeechSynthesisUtterance(bot.text.replace(/[।]/g, "."));
    u.lang = bot.language_code; u.rate = bot.voice.pace;
    const v = speechSynthesis.getVoices().find((x) => x.lang === bot.language_code) || speechSynthesis.getVoices().find((x) => x.lang?.startsWith(bot.language_code.slice(0, 2)));
    if (v) u.voice = v;
    u.onend = resolve; u.onerror = resolve; speechSynthesis.speak(u);
  });
}

// ---- listening ------------------------------------------------------------
// Live: record 16 kHz mono WAV and send to Saaras. Offline: browser speech recognition.
const rec = { ctx: null, node: null, src: null, stream: null, chunks: [], recog: null };
async function startRec() {
  stopAudio();
  if (state.mode !== "live") {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { status("Browser speech recognition not available; type instead."); return; }
    rec.recog = new SR(); rec.recog.lang = state.persona?.language?.code || "hi-IN"; rec.recog.interimResults = false;
    rec.recog.onresult = (e) => sellerSays(e.results[0][0].transcript);
    rec.recog.onerror = (e) => status("Mic: " + e.error);
    rec.recog.start(); $("mic").classList.add("rec"); status("Listening…"); return;
  }
  rec.stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true } });
  rec.ctx = new AudioContext({ sampleRate: 16000 });
  rec.src = rec.ctx.createMediaStreamSource(rec.stream);
  rec.node = rec.ctx.createScriptProcessor(4096, 1, 1); rec.chunks = [];
  rec.node.onaudioprocess = (e) => rec.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  rec.src.connect(rec.node); rec.node.connect(rec.ctx.destination);
  $("mic").classList.add("rec"); status("Listening… release to send");
}
function stopRec() {
  $("mic").classList.remove("rec");
  if (rec.recog) { rec.recog.stop(); rec.recog = null; return; }
  if (!rec.ctx) return;
  rec.node.disconnect(); rec.src.disconnect(); rec.stream.getTracks().forEach((t) => t.stop());
  const rate = rec.ctx.sampleRate; rec.ctx.close(); rec.ctx = null;
  const len = rec.chunks.reduce((n, c) => n + c.length, 0);
  if (len < rate * 0.3) { status("Too short, hold the button while you speak."); return; }
  sellerSays(null, encodeWav(rec.chunks, len, rate)); status("Transcribing…");
}
function encodeWav(chunks, len, rate) {
  const buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, len * 2, true);
  let o = 44; for (const c of chunks) for (let i = 0; i < c.length; i++, o += 2) { const s = Math.max(-1, Math.min(1, c[i])); v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  return new Blob([buf], { type: "audio/wav" });
}
$("mic").onmousedown = $("mic").ontouchstart = (e) => { e.preventDefault(); startRec().catch((err) => status("Mic: " + err.message)); };
$("mic").onmouseup = $("mic").onmouseleave = $("mic").ontouchend = () => stopRec();

$("export").onclick = async () => {
  const r = await api(`/api/session/${state.session}`);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 2)], { type: "application/json" }));
  a.download = `call_${r.seller_id}_${r.session_id}.json`; a.click();
};
init().catch((e) => status("⚠ " + e.message));
</script>
</body>
</html>
